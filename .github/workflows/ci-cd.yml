name: Build and Release Theme

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Package Theme
      run: |
        mkdir -p dist/docy
        rsync -a --exclude='dist' --exclude='.git' --exclude='.github' --exclude='node_modules' . dist/docy/
        cd dist
        zip -r docy.zip docy/
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docy-theme
        path: dist/docy.zip

    - name: FTP Deploy to Production
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/docy/
        server-dir: wp-content/themes/docy/
